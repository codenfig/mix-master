name: Flutter source checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-checks.yml'
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate platform scaffolding
        working-directory: flutter
        run: flutter create . --platforms=android,ios,windows,macos,linux
      - name: Install packages
        working-directory: flutter
        run: flutter pub get
      - name: Analyze Dart source
        working-directory: flutter
        run: flutter analyze lib
