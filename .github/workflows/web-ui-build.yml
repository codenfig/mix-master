name: Web UI build
on:
  push:
    branches: [main, feature/mixmaster-system-hardening]
    paths:
      - 'web/**'
      - '.github/workflows/web-ui-build.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-ui-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
